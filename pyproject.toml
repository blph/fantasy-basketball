[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-bb"
version = "0.1.0"
description = "Draft assistant, digests, and roster management for a Yahoo 9-cat H2H NBA fantasy league"
requires-python = ">=3.11"

# Runtime dependencies land in Phase 2. Each one needs an ADR (see AGENTS.md).
# Expected: duckdb, pyarrow, httpx, pyyaml.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
