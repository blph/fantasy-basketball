[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-bb"
version = "0.1.0"
description = "Draft assistant, digests, and roster management for a Yahoo 9-cat H2H NBA fantasy league"
requires-python = ">=3.11"

# Runtime dependencies land in Phase 2. Each one needs an ADR (see AGENTS.md).
# Expected: duckdb, pyarrow, httpx, pyyaml.
dependencies = []

[project.optional-dependencies]
# numpy/matplotlib/scipy serve `scripts/analysis/` only and never enter `src/`;
# the project still ships zero runtime dependencies. They are in `dev` rather
# than their own extra so CI installs them and can actually test that code.
# See ADR-0015.
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
